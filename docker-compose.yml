services:
  postgres:
    image: postgres:15-alpine
    container_name: springboot_task_db_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dev_task_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dev_task_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
